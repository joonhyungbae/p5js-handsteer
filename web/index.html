<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>손으로 조종하기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%238fe3d2'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <div class="left">
    <div id="stage"></div>
    <div class="bar">
      <button id="sound">소리 켜기</button>
      <button id="rec">녹화 시작</button>
      <button id="snap">사진 저장</button>
      <button id="only">미리보기만</button>
      <span class="fps" id="fps"></span>
    </div>
  </div>

  <aside>
    <div class="card">
      <h2>무엇을 보나</h2>
      <select id="source">
        <option value="camera">카메라</option>
        <option value="sim">가짜 사람</option>
        <option value="file">영상 파일 열기…</option>
      </select>
      <input type="file" id="file" accept="video/*" hidden />
      <div id="status">시작하는 중</div>
    </div>

    <div class="card">
      <h2>감지한 것 (노란 점이 손목)</h2>
      <canvas id="preview" width="256" height="192"></canvas>
    </div>

    <div class="card">
      <h2>손에서 뽑은 숫자</h2>
      <div id="features"></div>
    </div>

    <div class="card">
      <h2>내보내는 조작값 (규칙은 web/steer.js, 그림은 web/sketch.js)</h2>
      <div id="steer"></div>
      <div class="hint">그림과 소리는 이 브라우저가 냅니다. 다른 도구로 넘기려면 OSC 나 /steer.json 을 씁니다</div>
    </div>

    <div class="card">
      <h2>조절</h2>
      <div id="params"></div>
      <button id="reset" style="margin-top:6px">처음 값으로</button>
    </div>

    <div class="card keys">
      H 조절판 숨기기 · F 전체 화면 · R 녹화 · 소리는 단추로 켭니다<br />
      조절한 값은 이 브라우저에 남습니다.
    </div>
  </aside>
</div>
<video id="video" playsinline muted></video>
<script src="vendor/p5/p5.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
